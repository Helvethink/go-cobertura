name: Go tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25'

    - name: Lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.14.0

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25'

    - name: Test
      run: go test -v ./...


    - name: Cache regression source trees
      uses: actions/cache@v4
      with:
        path: testdata/regression/**/src
        key: regression-src-${{ hashFiles('regression_test.go') }}

    - name: Regression tests
      run: go test -tags regression -run TestRegression -v -timeout 600s
